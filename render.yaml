# Render Blueprint: creates the PostgreSQL database and the web service together.
# Render dashboard → New → Blueprint → pick this GitHub repo.
databases:
  - name: erims-db
    databaseName: erims
    user: erims
    plan: free

services:
  - type: web
    name: erims
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python -m gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: erims-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 2
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
